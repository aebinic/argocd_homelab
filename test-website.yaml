# Test-Website für aebi-nicola.ch
# Anwenden:  kubectl apply -f test-website.yaml
# Entfernen: kubectl delete -f test-website.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: website
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: website-html
  namespace: website
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="de">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>aebi-nicola.ch</title>
      <style>
        body { font-family: system-ui, sans-serif; display: grid; place-items: center;
               min-height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0; }
        .box { text-align: center; padding: 2rem; }
        h1 { font-size: 2.5rem; margin-bottom: .5rem; }
        p  { color: #94a3b8; }
      </style>
    </head>
    <body>
      <div class="box">
        <h1>Hallo von aebi-nicola.ch 👋</h1>
        <p>Diese Seite läuft auf meinem Kubernetes-Homelab.</p>
      </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine   # läuft ohne root, Port 8080
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: html
          configMap:
            name: website-html
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: website
spec:
  selector:
    app: website
  ports:
    - name: http
      port: 80
      targetPort: 8080